<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>Calculadora Dutra</title>
  </head>
  <body>
    <main id="container">
      <div id="telefone">
        <div id="ilha-dinamica"></div>

        <div id="barra-status">
          <span id="hora">--:--</span>

          <div id="icones-status">
            <img
              class="icone-status icone-status-sinal"
              src="https://raw.githubusercontent.com/brendanballon/sfsymbols-svg/master/symbols/cellularbars.svg"
              alt="sinal"
            />
            <img
              class="icone-status icone-status-wifi"
              src="https://raw.githubusercontent.com/brendanballon/sfsymbols-svg/master/symbols/wifi.svg"
              alt="wifi"
            />
            <img
              class="icone-status"
              src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/battery-full.svg"
              alt="bateria"
            />
          </div>
        </div>

        <div id="calculadora">
          <div id="display">
            <div id="visor-expressao"></div>
            <div id="visor-resultado"></div>
          </div>

          <div id="grid-numeros">
            <button type="button" class="botao-funcao" data-acao="limpar">
              C
            </button>
            <button type="button" class="botao-funcao" data-acao="porcentagem">
              <img
                class="icone"
                src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/percent.svg"
                alt="%"
              />
            </button>
            <button type="button" class="botao-operador" data-valor="÷">
              <img
                class="icone"
                src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/divide.svg"
                alt="÷"
              />
            </button>
            <button type="button" class="botao-funcao" data-acao="apagar">
              <img
                class="icone"
                src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/delete.svg"
                alt="apagar"
              />
            </button>

            <button type="button" class="botao-numero" data-valor="7">7</button>
            <button type="button" class="botao-numero" data-valor="8">8</button>
            <button type="button" class="botao-numero" data-valor="9">9</button>
            <button type="button" class="botao-operador" data-valor="×">
              <img
                class="icone"
                src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/x.svg"
                alt="×"
              />
            </button>

            <button type="button" class="botao-numero" data-valor="4">4</button>
            <button type="button" class="botao-numero" data-valor="5">5</button>
            <button type="button" class="botao-numero" data-valor="6">6</button>
            <button type="button" class="botao-operador" data-valor="-">
              <img
                class="icone"
                src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/minus.svg"
                alt="−"
              />
            </button>

            <button type="button" class="botao-numero" data-valor="1">1</button>
            <button type="button" class="botao-numero" data-valor="2">2</button>
            <button type="button" class="botao-numero" data-valor="3">3</button>
            <button type="button" class="botao-operador" data-valor="+">
              <img
                class="icone"
                src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/plus.svg"
                alt="+"
              />
            </button>

            <button type="button" class="botao-numero" data-valor="00">
              00
            </button>
            <button type="button" class="botao-numero" data-valor="0">0</button>
            <button type="button" class="botao-numero" data-valor=".">.</button>
            <button type="button" id="botao-igual" data-acao="igual">
              <img
                class="icone"
                src="https://cdn.jsdelivr.net/npm/lucide-static@latest/icons/equal.svg"
                alt="="
              />
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
